# Single GPU + AMP Mixed Precision 实验
# 与 single_gpu.yaml（FP32）对比，验证 V100 Tensor Core 加速效果

model:
  vocab_size: 30522
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  max_seq_len: 512
  dropout: 0.1
  use_activation_checkpointing: false

training:
  batch_size: 8
  max_steps: 1000
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  log_interval: 10
  gradient_accumulation_steps: 1

# AMP 开启
amp:
  enabled: true

data:
  use_random: true
  seq_len: 512
  vocab_size: 30522

logging:
  log_dir: "experiments/logs"
  save_metrics: true
  metrics_csv: "experiments/single_gpu_amp_metrics.csv"
