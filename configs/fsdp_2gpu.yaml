# 2-GPU FSDP 训练配置
# 与 DDP 使用相同模型，对比参数分片的显存和性能差异

# ---- 模型超参（与 single GPU / DDP 一致）----
model:
  vocab_size: 30522
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  max_seq_len: 512
  dropout: 0.1

# ---- 训练超参 ----
training:
  batch_size: 8
  max_steps: 1000
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  log_interval: 10

# ---- 数据 ----
data:
  use_random: true
  seq_len: 512
  vocab_size: 30522

# ---- 日志与输出 ----
logging:
  log_dir: "experiments/logs"
  save_metrics: true
  metrics_csv: "experiments/fsdp_2gpu_metrics.csv"
