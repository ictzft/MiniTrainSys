# 2-GPU DDP 训练配置（FP32 baseline）
# 与 single_gpu.yaml 使用相同模型，对比分布式训练效果

model:
  vocab_size: 30522
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  max_seq_len: 512
  dropout: 0.1
  use_activation_checkpointing: false

training:
  batch_size: 8
  max_steps: 1000
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  log_interval: 10
  gradient_accumulation_steps: 1

amp:
  enabled: false

data:
  use_random: true
  seq_len: 512
  vocab_size: 30522

logging:
  log_dir: "experiments/logs"
  save_metrics: true
  metrics_csv: "experiments/ddp_2gpu_metrics.csv"
