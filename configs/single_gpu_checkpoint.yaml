# Single GPU + Activation Checkpointing 实验
# 与 single_gpu.yaml 对比，验证显存节省和速度损失

model:
  vocab_size: 30522
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  max_seq_len: 512
  dropout: 0.1
  # Activation checkpointing 开启
  # 前向不保存中间激活值，反向时重新计算
  # 用计算时间换显存，反向耗时增加约 15%~30%
  use_activation_checkpointing: true

training:
  batch_size: 8
  max_steps: 1000
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  log_interval: 10
  gradient_accumulation_steps: 1

amp:
  enabled: false

data:
  use_random: true
  seq_len: 512
  vocab_size: 30522

logging:
  log_dir: "experiments/logs"
  save_metrics: true
  metrics_csv: "experiments/single_gpu_checkpoint_metrics.csv"
